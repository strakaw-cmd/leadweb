name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        # Volitelné proměnné repozitáře (Settings → Secrets and variables → Actions → Variables):
        # CUSTOM_DOMAIN (např. www.zmenitdodavatele.cz), GA4_ID, GADS_ID, GADS_LEAD_LABEL, GADS_CALL_LABEL, SKLIK_CONV_ID, SKLIK_RTG_ID, META_PIXEL_ID.
        # Bez nich se web staví přesně jako dosud (github.io/leadweb, bez měření a bez cookie lišty).
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then export SITE_URL="https://$CUSTOM_DOMAIN" BASE_PATH=""; else export SITE_URL="https://strakaw-cmd.github.io/leadweb" BASE_PATH="/leadweb"; fi
          node src/build.mjs
        env:
          STATIC: "1"
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          GA4_ID: ${{ vars.GA4_ID }}
          GADS_ID: ${{ vars.GADS_ID }}
          GADS_LEAD_LABEL: ${{ vars.GADS_LEAD_LABEL }}
          GADS_CALL_LABEL: ${{ vars.GADS_CALL_LABEL }}
          SKLIK_CONV_ID: ${{ vars.SKLIK_CONV_ID }}
          SKLIK_RTG_ID: ${{ vars.SKLIK_RTG_ID }}
          META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
